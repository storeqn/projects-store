<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة نظام الدليفري</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#07111f;color:#eef4ff}.app{max-width:430px;margin:auto;min-height:100vh;background:#0b1526}.top{padding:18px;background:linear-gradient(135deg,#132541,#1e3a5f);position:sticky;top:0}.top small{color:#9fb2cc}.top h1{margin:4px 0 0;font-size:22px}.notice{margin:14px;padding:12px;border-radius:14px;background:#172036;border:1px solid #2b3a59;color:#b9c7da;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}.stat{background:#101d31;border:1px solid #223555;border-radius:15px;padding:14px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:#91a1b8}.section{padding:16px 14px}.section h2{font-size:16px;margin:0 0 10px}.order{background:#0f1a2b;border:1px solid #223555;border-radius:16px;padding:14px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:12px;padding:5px 9px;border-radius:999px;background:#182945;color:#b7d2ff}.muted{color:#91a1b8;font-size:13px}.order h3{margin:9px 0 4px;font-size:17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}.primary{background:#2d6cdf;color:#fff}.secondary{background:#17243a;color:#dbe8ff}.done{background:#163a2c;color:#9ef0c6}.footer{padding:18px 14px 35px}.back{display:block;text-align:center;background:#17243a;padding:12px;border-radius:12px;color:#dbe8ff;text-decoration:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:10px;display:none;z-index:9}.empty{padding:24px;text-align:center;color:#8fa1ba;border:1px dashed #2a3c5d;border-radius:15px}</style></head><body><div class="app"><div class="top"><small>نسخة تجريبية آمنة</small><h1>إدارة الدليفري</h1></div><div class="notice">هذه نسخة للتجربة فقط. جميع البيانات وهمية، ولا يتم حفظ أي تعديل أو إرساله إلى قاعدة بيانات.</div><div class="stats"><div class="stat"><b id="activeCount">2</b><span>طلبات نشطة</span></div><div class="stat"><b id="doneCount">1</b><span>مكتملة</span></div><div class="stat"><b>3</b><span>سائقون</span></div></div><div class="section"><h2>الطلبات الحالية</h2><div id="orders"></div></div><div class="footer"><a class="back" href="delivery.html">العودة إلى صفحة النظام</a></div></div><div class="toast" id="toast"></div><script>let orders=[{id:101,name:'طلب مطعم الرافدين',driver:'أحمد',status:'جاهز للتوصيل'},{id:102,name:'طلب مطعم النخيل',driver:'حسين',status:'بالطريق'},{id:103,name:'طلب مطعم المدينة',driver:'علي',status:'تم التسليم'}];function render(){const box=document.getElementById('orders');box.innerHTML=orders.map(o=>`<div class="order"><div class="row"><span class="tag">#${o.id}</span><span class="muted">السائق: ${o.driver}</span></div><h3>${o.name}</h3><div class="muted">الحالة: <b>${o.status}</b></div><div class="actions">${o.status==='تم التسليم'?`<button class="btn done" disabled>مكتمل</button><button class="btn secondary" onclick="resetOrder(${o.id})">إعادة للتجربة</button>`:`<button class="btn primary" onclick="advance(${o.id})">تحديث الحالة</button><button class="btn secondary" onclick="showMap(${o.id})">عرض الخريطة</button>`}</div></div>`).join('');document.getElementById('activeCount').textContent=orders.filter(o=>o.status!=='تم التسليم').length;document.getElementById('doneCount').textContent=orders.filter(o=>o.status==='تم التسليم').length}function advance(id){const o=orders.find(x=>x.id===id);if(o.status==='جاهز للتوصيل')o.status='بالطريق';else if(o.status==='بالطريق')o.status='تم التسليم';toast('تم تحديث الحالة تجريبياً — بدون حفظ');render()}function resetOrder(id){const o=orders.find(x=>x.id===id);o.status='جاهز للتوصيل';toast('تمت إعادة الطلب للتجربة');render()}function showMap(){toast('معاينة الخريطة تجريبية فقط');}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}render();</script></body></html>
